[package]
name = "nsrlquery"
version.workspace = true
edition = "2021"

[dependencies]
colored = "3.1.1"
# rustls (TLS 1.2 + 1.3 everywhere) instead of the platform TLS stack: macOS Secure
# Transport has no TLS 1.3, so TLS-1.3-only APIs failed with "bad protocol version".
# native-roots keeps trusting the OS certificate store (corporate CAs still work).
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "charset", "http2", "system-proxy"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
common_ui = { path = "../common_ui" }
clap = { version = "4", features = ["derive"] }
common_config = { path = "../common_config" }
chrono = "0.4.43"
