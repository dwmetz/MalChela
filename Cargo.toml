[workspace]
resolver = "2"
members = [ "about", "combine_yara", "extract_samples", "fileanalyzer", "hashit", "mstrings", "malchela", "mzcount", "strings_to_yara", "cached", "common_config", "mismatchminer", "nsrlquery", "config", "common_ui", "hashcheck", "mzhash", "xmzhash", "fileminer", "MITRE_lookup", "tiquery", "plist_analyzer", "macho_info", "codesign_check", "common_macho", "yara-backend", "dpp_extract", "unpack", "yara_scan"]

# Single source of truth for the MalChela release version. Every tool crate
# inherits it (version.workspace = true); the web server, PWA, and MCP plugin
# read it from here at runtime. Bump this one line for a release.
[workspace.package]
version = "4.5.0"

[patch.crates-io]
serde_yml = { path = "vendor/serde_yml" }
